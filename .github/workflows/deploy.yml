name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrhelpdeskappw0zuc
  ACR_LOGIN_SERVER: acrhelpdeskappw0zuc.azurecr.io
  RESOURCE_GROUP: rg-helpdeskapp
  CONTAINER_APP: ca-helpdeskapp
  IMAGE_REPO: helpdesk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          docker build -t "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ github.sha }}" -t "$ACR_LOGIN_SERVER/$IMAGE_REPO:latest" .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_REPO:latest"

      - name: Deploy to Azure Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ github.sha }}"
